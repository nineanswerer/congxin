<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>从心日报 · 把你的收藏印成一张报</title>
<meta name="description" content="从心日报：把你的知乎收藏与阅读痕迹印成一张复古报刊头版，每张都能点回原文。" />
<!-- Hallmark / Broadside：Six Caps + Bevan + Archivo Narrow（拉丁），Noto 中文回退 -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Six+Caps&family=Bevan&family=Archivo+Narrow:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet" />
<!-- 官方主题令牌与地基（scaffold broadside），必须先于 app.css -->
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
<div class="grain"></div>

<header class="topbar">
  <div class="brand">
    <div class="logo">从<em>心</em></div>
    <div class="track">AI × 陪伴与交互 · 知乎黑客松 S3</div>
  </div>
  <div class="topright">
    <div class="pill" id="pill-profile"><span class="dot"></span><span id="profile-text">连接中…</span></div>
    <div class="pill" id="pill-quota">额度查询中</div>
    <div class="tone-switch" id="tone-switch"></div>
    <button class="pill outro-trigger" id="btn-outro" title="落版（4:50 至 5:00）· 快捷键 O / End">落版</button>
  </div>
</header>

<!-- ============================ 每日日报 · 首屏头版 ============================
     把真实收藏 / 读过的东西印成一张复古报刊。由 daily.js 用真实数据渲染，
     打开即是首屏；点「翻开内页」进入下面的桌宠工作台（问答 / 照镜子）。 -->
<section class="daily-front" id="daily-front">
  <div class="daily-paper" id="daily-paper"></div>
  <button class="daily-enter" id="daily-enter" type="button">翻开内页 ↓ · 桌宠在下面等你</button>
</section>

<nav class="tabs" id="tabs">
  <button data-tab="flow" class="is-on">主流程 · 它在陪你干活</button>
  <button data-tab="mirror">照镜子 · 认知闭环</button>
</nav>

<main class="stage">

  <!-- ============================ 桌宠 ============================ -->
  <section class="pet" id="pet">
    <div class="bubble" data-pet-bubble><span class="muted">（安静看着你）</span></div>
    <div class="petfigure">
      <div class="petanim">
        <img data-pet-img src="../assets/kanshan/idle.webp" alt="刘看山" />
      </div>
    </div>
    <div class="petstate" role="status"><span class="b"></span><span data-pet-state>待机</span></div>

    <div class="tray">
      <div class="trayhead">
        <h3>材料</h3>
        <span class="hint">来自你知乎收藏里的真实内容</span>
      </div>
      <div class="dropzone" id="dropzone">
        <b>把资料拖进来</b>
        拖进来的文本没有知乎出处，卡片出处只来自知乎真实内容
      </div>
      <div class="trayactions">
        <button class="btn primary" id="btn-feed">用我的收藏喂它</button>
        <button class="btn ghost" id="btn-views">知乎上大家怎么说</button>
      </div>
      <div class="materials" id="materials"></div>
    </div>
  </section>

  <!-- ============================ 主流程 ============================ -->
  <section class="panel" id="panel-flow">
    <div id="flow-cards"></div>
    <div id="flow-views"></div>
    <div id="flow-list"></div>
  </section>

  <!-- ============================ 照镜子 ============================ -->
  <section class="panel hidden" id="panel-mirror">
    <div id="mirror-quiz"></div>
    <div id="mirror-fracture"></div>
    <div id="mirror-situation"></div>
    <div id="mirror-terrain"></div>
  </section>

</main>

<footer class="strip" id="strip"></footer>

<!-- ============================ 落版（4:50 至 5:00） ============================
     内容来自 docs/P1-三件产出.md §2.4，**不归语气目录管**（这一拍没有台词）。
     快捷键：O / End 出，Esc 关。 -->
<div class="outro" id="outro" aria-hidden="true" role="dialog" aria-label="从心 · 落版">
  <img class="outro-pet" src="../assets/kanshan/idle.webp" alt="刘看山 · 待机" />
  <div class="outro-title">从<em>心</em></div>
  <div class="outro-track">AI × 陪伴与交互</div>
  <div class="outro-line">每张卡片都能点回知乎原话</div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
